<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4eeff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Happinometer" />
<title>Happinometer · ประเมินความพึงพอใจผู้ป่วย</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='.5' stop-color='%23ffcf3a'/%3E%3Cstop offset='1' stop-color='%232fd4a7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23fff'/%3E%3Cpath d='M12 40a20 20 0 0 1 40 0' stroke='url(%23g)' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M32 40 L44 25' stroke='%233a2a4f' stroke-width='4.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='40' r='5' fill='%233a2a4f'/%3E%3Cpath d='M22 49q10 7 20 0' stroke='%23ff6fa5' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#2b2350; --ink2:#5b5480; --muted:#9a94b8; --line:rgba(124,108,255,.14);
  --pink:#ff6fa5; --violet:#7c6cff; --mint:#2fd4a7; --sun:#ffc93c; --sky:#5aa9ff;
  --card:rgba(255,255,255,.76); --r:26px;
  --shadow:0 1px 0 rgba(255,255,255,.95) inset,0 18px 40px -20px rgba(76,56,170,.38),0 3px 10px -5px rgba(76,56,170,.14);
  --font:'IBM Plex Sans Thai Looped',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Mitr',var(--font);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:#f7f2ff;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(165deg,#fff0f6 0%,#f2edff 48%,#e7fbf4 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(55px);opacity:.55;animation:float 18s ease-in-out infinite}
.b1{width:340px;height:340px;background:#ffb3d1;top:-100px;left:-90px}
.b2{width:300px;height:300px;background:#bcb0ff;top:32%;right:-130px;animation-delay:-6s}
.b3{width:340px;height:340px;background:#9ff0d6;bottom:-140px;left:8%;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-24px) scale(1.08)}66%{transform:translate(-22px,26px) scale(.94)}}

/* ---------- shell ---------- */
.shell{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(104px + var(--safe-b));position:relative;transition:max-width .45s ease}
body.wide .shell{max-width:1140px}
body.kiosk .shell{padding-bottom:calc(24px + var(--safe-b))}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:42px;height:42px;flex:none;border-radius:14px;background:linear-gradient(145deg,#fff,#f1ecff);box-shadow:var(--shadow);display:grid;place-items:center}
.wordmark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.2px;line-height:1;background:linear-gradient(100deg,#ff6fa5 0%,#a36bff 45%,#4f7dff 75%,#22c7a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.2px}
.room-chip{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:var(--shadow);max-width:55%;transition:transform .15s}
.room-chip:active{transform:scale(.96)}
.room-chip .ic{color:var(--pink)}
.room-chip b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#c9c3e4;flex:none;box-shadow:0 0 0 3px rgba(201,195,228,.25)}
.sync-dot.ok{background:#22c58b;box-shadow:0 0 0 3px rgba(34,197,139,.2)}
.sync-dot.pending,.sync-dot.syncing{background:#ffb020;box-shadow:0 0 0 3px rgba(255,176,32,.22);animation:pulse 1.2s infinite}
.sync-dot.error{background:#ff5a6a;box-shadow:0 0 0 3px rgba(255,90,106,.2)}
body.kiosk .room-chip{pointer-events:none;opacity:.85}

/* ---------- generic ---------- */
.card{background:var(--card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.88);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-family:var(--display);font-weight:500;font-size:16px}
.card-title .ic{color:var(--violet)}
.card-title span.t{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grad{background:linear-gradient(100deg,#ff6fa5,#8b6cff 60%,#3fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:12px 18px;font-weight:600;transition:transform .12s ease,box-shadow .2s,filter .2s;user-select:none}
.btn:active{transform:translateY(2px) scale(.98)}
.btn-primary{color:#fff;background:linear-gradient(135deg,#ff7eb3 0%,#a26cff 55%,#6f7bff 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(40,0,90,.14),0 14px 26px -10px rgba(124,108,255,.7)}
.btn-primary:disabled{filter:grayscale(.7) opacity(.5);box-shadow:none;cursor:not-allowed}
.btn-soft{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(124,108,255,.1),0 8px 18px -12px rgba(76,56,170,.45)}
.btn-ghost{background:rgba(124,108,255,.08);color:var(--violet)}
.btn-danger{background:#fff0f2;color:#e5484d}
.btn-sm{padding:8px 12px;border-radius:14px;font-size:13px}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:var(--shadow);color:var(--ink2);transition:transform .12s}
.icon-btn:active{transform:scale(.92)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;font-size:13.5px;font-weight:500;color:var(--ink2);box-shadow:0 1px 0 rgba(255,255,255,1) inset,0 6px 14px -10px rgba(76,56,170,.5);border:1.5px solid rgba(124,108,255,.1);transition:all .18s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;background:linear-gradient(135deg,#ff7eb3,#8b6cff);border-color:transparent;box-shadow:0 8px 16px -8px rgba(139,108,255,.8)}
.chip small{opacity:.7;font-weight:400;margin-left:4px}

input.inp,select.inp{width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(124,108,255,.16);background:#fff;outline:none;transition:border .2s,box-shadow .2s;font-size:14.5px}
input.inp:focus,select.inp:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,108,255,.14)}
select.inp{background-color:#fff;cursor:pointer;padding:11px 12px}
label.lbl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:500}

.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:26px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 #fff inset,0 18px 40px -14px rgba(76,56,170,.45);z-index:20;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
body.kiosk .tabbar{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.tab{display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:20px;color:var(--muted);font-weight:600;font-size:13.5px;transition:all .25s}
.tab .lab{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s}
.tab.on{color:#fff;background:linear-gradient(135deg,#ff7eb3,#8b6cff);box-shadow:0 10px 18px -8px rgba(139,108,255,.85)}
.tab.on .lab{max-width:90px}

/* ---------- home ---------- */
.hero{padding:18px 18px 16px;overflow:hidden;text-align:center}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;font-size:12.5px;color:var(--muted)}
.gauge-wrap{width:min(270px,78%);margin:6px auto -4px;position:relative}
.gauge{width:100%;height:auto;overflow:visible;display:block}
.gauge .needle{transform-origin:120px 122px;transition:transform 1.3s cubic-bezier(.34,1.56,.64,1)}
.gauge .needle.idle{animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(62deg)}}
.gauge .gface{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero-title{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.35;margin:6px 0 12px;position:relative}
.room-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,126,179,.1),rgba(124,108,255,.1));border:1.5px dashed rgba(124,108,255,.28);transition:transform .15s}
.room-card:active{transform:scale(.98)}
.room-card .pin{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--pink);box-shadow:0 8px 16px -10px rgba(255,111,165,.8);flex:none}
.room-card .meta{flex:1;min-width:0}
.room-card .meta b{display:block;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.2}
.room-card .meta span{font-size:12.5px;color:var(--ink2)}
.room-card .chg{font-size:12px;color:var(--violet);font-weight:600;display:flex;align-items:center;gap:2px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{padding:10px 6px;border-radius:18px;background:rgba(255,255,255,.75);box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(76,56,170,.4)}
.mini b{display:block;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.mini span{font-size:11.5px;color:var(--muted)}
.cta{width:100%;margin-top:16px;padding:20px;border-radius:26px;font-size:21px;font-family:var(--display);font-weight:500;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.cta .ic{width:26px;height:26px;animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-6deg)}}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 16px}
.today-faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.today-faces .tf svg{width:100%;max-width:52px;height:auto;display:block;margin:0 auto 4px}
.today-faces b{font-family:var(--display);font-weight:500;font-size:16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.5;margin-bottom:12px;background:rgba(255,201,60,.16);border:1px solid rgba(255,190,40,.35);color:#7a5a00}
.banner .ic{margin-top:1px}
.banner button{color:var(--violet);font-weight:600;text-decoration:underline}

/* ---------- face svg ---------- */
.face{display:block;overflow:visible}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.face .tear{animation:tear 1.8s ease-in infinite}
@keyframes tear{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}

/* ---------- survey ---------- */
.survey{display:flex;flex-direction:column;min-height:calc(100dvh - 120px)}
.q-head{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:12px;border-radius:999px;background:rgba(124,108,255,.12);overflow:hidden;box-shadow:inset 0 2px 3px rgba(76,56,170,.12)}
.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff7eb3,#a26cff,#4fb8ff);transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.progress i::after{content:"";position:absolute;inset:2px 6px auto;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.q-meta{margin:16px 2px 4px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.q-meta b{color:var(--violet);font-weight:600}
.q-title{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.35;margin:4px 2px 18px}
.q-title em{font-style:normal;background:linear-gradient(100deg,#ff6fa5,#8b6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.q-body{flex:1}
.in-r{animation:inR .42s cubic-bezier(.2,.8,.2,1) both}
.in-l{animation:inL .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;border-radius:24px;padding:16px 14px;text-align:center;background:linear-gradient(180deg,#ffffff,#f9f7ff);border:2.5px solid transparent;box-shadow:0 2px 0 #fff inset,0 -4px 0 rgba(124,108,255,.07) inset,0 14px 26px -16px rgba(76,56,170,.5);transition:transform .16s ease,box-shadow .2s,border-color .2s;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}.opt:nth-child(5){animation-delay:.2s}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.opt:active{transform:scale(.96)}
.opt.sel{border-color:var(--violet);box-shadow:0 0 0 6px rgba(124,108,255,.14),0 16px 30px -16px rgba(124,108,255,.7);transform:translateY(-3px)}
.opt .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff7eb3,#8b6cff);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt.sel .tick{transform:scale(1)}
.opt .tick .ic{width:15px;height:15px;stroke-width:3}
.opt .t1{display:block;font-family:var(--display);font-weight:500;font-size:20px;margin-top:6px}
.opt .t2{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .avatar{width:96px;height:96px;display:block;margin:4px auto 0}
.opt.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px}
.opt.wide .t1{margin:0;font-size:18px}
.opt.small{padding:12px}
.opt.small .t1{font-size:16px;margin:0}
.age-opt{text-align:left;padding:16px 16px 14px;overflow:hidden}
.age-opt::before{content:"";position:absolute;right:-24px;top:-24px;width:86px;height:86px;border-radius:50%;background:var(--c);opacity:.16}
.age-opt .num{font-family:var(--display);font-weight:600;font-size:32px;line-height:1;color:var(--c);display:block}
.age-opt .num small{font-size:15px;font-weight:500;color:var(--ink2);margin-left:3px}
.age-opt .t2{font-size:13px;color:var(--ink2);margin-top:6px}
.age-opt .dotrow{display:flex;gap:3px;margin-top:8px}
.age-opt .dotrow i{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.25}
.age-opt .dotrow i.f{opacity:1}
.right-opt .ricon{width:58px;height:58px;display:block;margin:2px auto 0;filter:drop-shadow(0 8px 10px rgba(76,56,170,.18))}
.right-opt .t1{font-size:18px}

/* rating */
.rate-stage{display:flex;flex-direction:column;align-items:center}
.rate-hero{width:150px;height:150px;position:relative;margin:0 auto 4px}
.rate-hero .face{width:100%;height:100%;filter:drop-shadow(0 18px 18px rgba(76,56,170,.22))}
.rate-hero .face.swap{animation:swap .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes swap{0%{transform:scale(.6) rotate(-10deg)}100%{transform:none}}
.rate-hero .ph{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#efeaff 70%);box-shadow:inset 0 -8px 16px rgba(124,108,255,.12),0 18px 30px -18px rgba(76,56,170,.5);font-family:var(--display);font-size:62px;color:#c5bcf5;animation:bob 2.6s ease-in-out infinite}
.rate-label{min-height:44px;margin:8px 0 14px;display:flex;align-items:center;justify-content:center}
.rate-label span{padding:8px 18px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:19px;color:#fff;background:var(--c);box-shadow:0 10px 20px -10px var(--c);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.rate-label .idle{background:none;color:var(--muted);font-family:var(--font);font-size:14.5px;box-shadow:none;animation:none}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;padding:16px 8px 12px;border-radius:28px;background:rgba(255,255,255,.6);box-shadow:inset 0 2px 6px rgba(76,56,170,.08),0 1px 0 #fff}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .25s,filter .25s;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.fbtn:nth-child(2){animation-delay:.06s}.fbtn:nth-child(3){animation-delay:.12s}.fbtn:nth-child(4){animation-delay:.18s}.fbtn:nth-child(5){animation-delay:.24s}
.fbtn .face{width:100%;max-width:64px;height:auto;filter:drop-shadow(0 8px 8px rgba(76,56,170,.2))}
.fbtn .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;background:#fff;color:var(--ink2);box-shadow:0 4px 10px -4px rgba(76,56,170,.4);transition:all .25s}
.fbtn:active{transform:scale(.9)}
.faces.has .fbtn{opacity:.5;filter:saturate(.6)}
.faces.has .fbtn.sel{opacity:1;filter:none;transform:translateY(-10px) scale(1.16)}
.fbtn.sel .n{background:var(--c);color:#fff}
.scale-cap{display:flex;justify-content:space-between;width:100%;padding:8px 6px 0;font-size:12px;color:var(--muted)}
.submit{margin-top:18px;width:100%;padding:18px;border-radius:24px;font-size:20px;font-family:var(--display);font-weight:500}

/* thanks */
.thanks{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.thanks .big{width:180px;height:180px;animation:jump 1.1s cubic-bezier(.3,1.6,.5,1) both}
.thanks .big .face{width:100%;height:100%;filter:drop-shadow(0 24px 22px rgba(76,56,170,.25))}
@keyframes jump{0%{transform:scale(.2) translateY(60px);opacity:0}60%{transform:scale(1.08) translateY(-10px);opacity:1}100%{transform:none}}
.thanks h2{font-family:var(--display);font-weight:500;font-size:30px;margin:18px 0 6px}
.thanks p{color:var(--ink2);margin:0 0 6px;line-height:1.6;font-size:16px}

/* ---------- bottom sheet ---------- */

.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#fff,#faf7ff);border-radius:30px 30px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px -20px rgba(43,35,80,.4)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#e1dcf5;margin:2px auto 12px}

/* ---------- toasts ---------- */

.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:18px;background:rgba(43,35,80,.92);color:#fff;font-size:14px;box-shadow:0 14px 30px -12px rgba(43,35,80,.6);animation:tin .4s cubic-bezier(.3,1.5,.5,1) both}

.toast.err{background:linear-gradient(135deg,#ff5a6a,#ff7e5f)}
.toast.live{background:linear-gradient(135deg,#ff7eb3,#8b6cff)}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}

function gaugeSVG(value) {
  const cx = 120, cy = 122, r = 92;
  const pt = (deg) => [cx + r * Math.cos((deg * Math.PI) / 180), cy + r * Math.sin((deg * Math.PI) / 180)];
  let segs = '';
  for (let i = 0; i < 5; i++) {
    const a0 = 180 + i * 36 + 3, a1 = 180 + (i + 1) * 36 - 3;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    segs += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${SCORES[i + 1].c2}" stroke-width="20" stroke-linecap="round" fill="none"/>`;
  }
  let ticks = '';
  for (let i = 1; i <= 5; i++) { const a = 180 + (i - 1) * 45; const rr = r - 26; ticks += `<text x="${(cx + rr * Math.cos(a * Math.PI / 180)).toFixed(1)}" y="${(cy + rr * Math.sin(a * Math.PI / 180) + 4).toFixed(1)}" font-size="11" text-anchor="middle" fill="#a59fc4" font-family="Mitr">${i}</text>`; }
  const has = value != null && !isNaN(value);
  const rot = has ? -90 + ((value - 1) / 4) * 180 : 0;
  const faceN = has ? Math.min(5, Math.max(1, Math.round(value))) : 5;
  return `<svg class="gauge" viewBox="0 0 240 140">
    <path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}" stroke="rgba(124,108,255,.08)" stroke-width="34" fill="none" stroke-linecap="round"/>
    ${segs}${ticks}
    <g class="needle ${has ? '' : 'idle'}" data-rot="${rot}" style="transform:rotate(${has ? -90 : 0}deg)">
      <path d="M115.5 122 L120 50 L124.5 122 Z" fill="#3a2a4f"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="13" fill="#3a2a4f"/><circle cx="${cx}" cy="${cy}" r="5" fill="#fff"/>
    <g class="gface"><g transform="translate(101 76) scale(.32)">${faceSVG(faceN).replace(/<svg\s+class="face[^"]*"/, '<svg class="face" width="120" height="120"')}</g></g>
  </svg>`;
}

/* =====================================================================

 * ===================================================================== */
const isGAS = () => !!(window.google && google.script && google.script.run);
const Backend = {
  get mode() { return isGAS() ? 'gas' : (settings.apiUrl ? 'url' : 'local'); },
  gas(fn, ...args) {
    return new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
  },
  url(params) { const u = settings.apiUrl.trim(); return u + (u.includes('?') ? '&' : '?') + new URLSearchParams(params).toString(); },
  async info() {
    if (this.mode === 'gas') return this.gas('apiInfo');
    if (this.mode === 'url') { const r = await fetch(this.url({ action: 'ping', _: Date.now() })); return r.json(); }
    return { ok: true, local: true };
  },
  async list(from, to) {
    if (this.mode === 'gas') return this.gas('apiList', from || '', to || '');
    if (this.mode === 'url') { const r = await fetch(this.url({ action: 'list', from: from || '', to: to || '', _: Date.now() })); return r.json(); }
    const all = load(LS.local, []);
    return { ok: true, records: all.filter((x) => (!from || x.date >= from) && (!to || x.date <= to)) };
  },
  async submit(records) {
    if (this.mode === 'gas') return this.gas('apiSubmit', records);
    if (this.mode === 'url') {
      const r = await fetch(settings.apiUrl.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'submit', records }) });
      return r.json();
    }
    const all = load(LS.local, []); const ids = new Set(all.map((x) => x.id));
    records.forEach((r) => { if (!ids.has(r.id)) all.push(r); });
    save(LS.local, all);
    return { ok: true, saved: records.map((r) => r.id) };
  },
};

/* ---- offline-first queue ---- */
let flushing = false, retryT = null, syncState = 'idle';
function setSync(state) {
  const q = load(LS.queue, []);
  syncState = state || (Backend.mode === 'local' ? 'local' : q.length ? 'pending' : 'ok');
  const dot = $('#syncDot');
  if (dot) { dot.className = 'sync-dot ' + syncState; dot.title = syncLabel(); }
}
function syncLabel() {
  const q = load(LS.queue, []).length;
  return ({ ok: 'เชื่อมต่อ Google Sheet แล้ว', pending: `รอส่ง ${q} รายการ`, syncing: 'กำลังส่งข้อมูล…', error: `ส่งไม่สำเร็จ (รอส่ง ${q}) จะลองใหม่อัตโนมัติ`, local: 'โหมดออฟไลน์ / สาธิต', idle: '' })[syncState] || '';
}
async function flushQueue() {
  if (flushing) return;
  const q = load(LS.queue, []);
  if (!q.length) { setSync(); return; }
  flushing = true; setSync('syncing');
  try {
    const res = await Backend.submit(q.slice(0, 100));
    if (!res || !res.ok) throw new Error((res && res.error) || 'submit failed');
    const saved = new Set(res.saved || []);
    save(LS.queue, load(LS.queue, []).filter((r) => !saved.has(r.id)));
    flushing = false;
    if (load(LS.queue, []).length && saved.size) return flushQueue();
    setSync();
  } catch (err) {
    flushing = false; setSync('error');
    clearTimeout(retryT); retryT = setTimeout(flushQueue, 15000);
  }
}
window.addEventListener('online', flushQueue);

async function fetchRecords(from, to) {
  const res = await Backend.list(from, to);
  if (!res || !res.ok) throw new Error((res && res.error) || 'list failed');
  const map = new Map();
  (res.records || []).forEach((r) => map.set(r.id, r));
  load(LS.queue, []).forEach((r) => { if ((!from || r.date >= from) && (!to || r.date <= to) && !map.has(r.id)) map.set(r.id, r); });
  return [...map.values()];
}

function tone(freqs, dur = 0.12, type = 'sine', gap = 0.07, vol = 0.16) {
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * gap);
      g.gain.exponentialRampToValueAtTime(vol, t0 + i * gap + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * gap + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + i * gap); o.stop(t0 + i * gap + dur + 0.03);
    });
  } catch (e) {}
}
const buzz = (ms = 12) => { if (settings.haptic && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} };
function confetti(n = 44, palette) {
  const fx = $('#fx'); const shapes = ['♥', '★', '●', '✦', '♥', '✿'];
  const colors = palette || ['#ff6fa5', '#8b6cff', '#2fd4a7', '#ffc93c', '#5aa9ff', '#ff9f43'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'cf';
    s.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    s.style.cssText = `color:${colors[i % colors.length]};font-size:${12 + Math.random() * 18}px;--x:${(Math.random() - 0.5) * Math.min(760, innerWidth * 1.4)}px;--y:${-(140 + Math.random() * 300)}px;--r:${(Math.random() - 0.5) * 900}deg;animation-delay:${Math.random() * 0.18}s`;
    fx.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}
function toast(msg, kind = '', ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.innerHTML = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
}
function countUp(root = document) {
  $$('[data-count]', root).forEach((el) => {
    const to = parseFloat(el.dataset.count); const dec = +(el.dataset.dec || 0); const suf = el.dataset.suf || '';
    if (isNaN(to)) { el.textContent = '–'; return; }
    const from = parseFloat(el.dataset.from || 0); const t0 = performance.now(); const D = 900;
    const stepF = (t) => { const p = Math.min(1, (t - t0) / D); const e = 1 - Math.pow(1 - p, 3); el.textContent = (from + (to - from) * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(stepF); };
    requestAnimationFrame(stepF);
  });
}

/* =====================================================================
 *  STATS
 * ===================================================================== */
function computeStats(list) {
  const st = { n: 0, sum: 0, dist: [0, 0, 0, 0, 0, 0], g: {}, a: {}, r: {}, room: {}, _list: list };
  const add = (m, k, s) => { k = k || 'ไม่ระบุ'; if (!m[k]) m[k] = { n: 0, sum: 0 }; m[k].n++; m[k].sum += s; };
  for (const x of list) {
    const s = +x.score; if (!(s >= 1 && s <= 5)) continue;
    st.n++; st.sum += s; st.dist[s]++;
    add(st.g, x.gender, s); add(st.a, x.age, s); add(st.r, x.right, s); add(st.room, `${x.unit || '-'}||${x.room || '-'}`, s);
  }
  st.avg = st.n ? st.sum / st.n : null;
  st.top2 = st.n ? ((st.dist[4] + st.dist[5]) / st.n) * 100 : null;
  st.low2 = st.n ? ((st.dist[1] + st.dist[2]) / st.n) * 100 : null;
  st.pct = st.n ? (st.avg / 5) * 100 : null;
  return st;
}

const PERIODS = [['today', 'วันนี้'], ['7d', '7 วัน'], ['30d', '30 วัน'], ['month', 'เดือนนี้'], ['fy', 'ปีงบฯ'], ['all', 'ทั้งหมด'], ['custom', 'กำหนดเอง']];
function periodRange(p) {
  const t = todayStr(); const d = new Date();
  if (p === 'today') return [t, t];
  if (p === '7d') return [addDays(t, -6), t];
  if (p === '30d') return [addDays(t, -29), t];
  if (p === 'month') return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  if (p === 'fy') { const y = d.getMonth() >= 9 ? d.getFullYear() : d.getFullYear() - 1; return [`${y}-10-01`, t]; }
  if (p === 'all') return ['', ''];
  return [dash.from || t, dash.to || t];
}
function periodLabel() {
  const [f, t] = periodRange(dash.period);
  if (dash.period === 'all') return 'ข้อมูลทั้งหมด';
  if (f === t) return thDate(f);
  return `${thDate(f)} – ${thDate(t)}`;
}
function scopeLabel() {
  if (dash.unit === 'ALL') return 'ภาพรวมทุกหน่วย';
  if (dash.room === 'ALL') return dash.unit;
  return `${dash.unit} › ${dash.room}`;
}

  return `<div class="donut-box"><svg viewBox="0 0 120 120" class="donut"><circle r="42" cx="60" cy="60" fill="none" stroke="#f0ecff" stroke-width="17"/><g class="spin"><g transform="rotate(-90 60 60)">${segs}</g></g><circle r="30" cx="60" cy="60" fill="#fff" opacity=".6"/><text x="60" y="62" class="dn-num">${total}</text><text x="60" y="77" class="dn-sub">คน</text></svg>

function trendSVG(list) {

    for (let h = h0; h <= h1; h++) { idx[pad(h)] = buckets.length; buckets.push({ k: pad(h), label: `${h}:00`, n: 0, sum: 0 }); }
    list.forEach((r) => { const b = buckets[idx[String(r.time || '').slice(0, 2)]]; if (b) { b.n++; b.sum += +r.score; } });
  } else if (mode === 'day') {
    for (let d = f; d <= t; d = addDays(d, 1)) { const dd = parseYmd(d); idx[d] = buckets.length; buckets.push({ k: d, label: `${dd.getDate()}/${dd.getMonth() + 1}`, n: 0, sum: 0 }); }
    list.forEach((r) => { const b = buckets[idx[r.date]]; if (b) { b.n++; b.sum += +r.score; } });
  } else {
    let d = parseYmd(f); d.setDate(1); const end = parseYmd(t);
    while (d <= end) { const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; idx[k] = buckets.length; buckets.push({ k, label: `${TH_M[d.getMonth()]}${String(d.getFullYear() + 543).slice(2)}`, n: 0, sum: 0 }); d.setMonth(d.getMonth() + 1); }
    list.forEach((r) => { const b = buckets[idx[String(r.date).slice(0, 7)]]; if (b) { b.n++; b.sum += +r.score; } });
  }
  const W = 640, H = 210, pl = 26, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const maxN = Math.max(1, ...buckets.map((b) => b.n)); const step = iw / buckets.length;
  const y = (v) => pt + ((5 - v) / 4) * ih;
  let grid = '';
  for (let v = 1; v <= 5; v++) grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(124,108,255,.1)" stroke-dasharray="3 5"/><text x="${pl - 8}" y="${y(v) + 3.5}" class="axis" text-anchor="end">${v}</text>`;
  const bars = buckets.map((b, i) => { const h = (b.n / maxN) * ih * 0.6; return b.n ? `<rect x="${(pl + i * step + step * 0.18).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}" width="${(step * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5, step * 0.2).toFixed(1)}" fill="url(#tb)"><title>${b.label}: ${b.n} คน</title></rect>` : ''; }).join('');

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const area = pts.length ? `${line} L${pts[pts.length - 1].x.toFixed(1)} ${pt + ih} L${pts[0].x.toFixed(1)} ${pt + ih} Z` : '';
  const every = Math.ceil(buckets.length / 9);
  const xl = buckets.map((b, i) => (i % every === 0 ? `<text x="${(pl + i * step + step / 2).toFixed(1)}" y="${H - 8}" class="axis" text-anchor="middle">${b.label}</text>` : '')).join('');
  const dots = pts.map((p) => `<circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${pts.length > 40 ? 2.5 : 4.5}" fill="#fff" stroke="${scoreColor(p.v)}" stroke-width="3"><title>${p.b.label}: เฉลี่ย ${p.v.toFixed(2)} (${p.b.n} คน)</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#ff7eb3"/><stop offset="1" stop-color="#8b6cff"/></linearGradient><linearGradient id="ta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98bff" stop-opacity=".28"/><stop offset="1" stop-color="#a98bff" stop-opacity="0"/></linearGradient><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3dcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient></defs>${grid}${bars}${area ? `<path d="${area}" fill="url(#ta)"/>` : ''}<path d="${line}" fill="none" stroke="url(#tl)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

        ${settings.sheetUrl ? `<a class="btn btn-soft btn-sm" style="text-decoration:none" href="${esc(settings.sheetUrl)}" target="_blank" rel="noopener">${ic('sheet')} เปิด Sheet</a>` : ''}
      </div>
      <div class="row" style="margin-top:12px;border-top:1px solid var(--line)"><div class="l"><b>คิวรอส่ง</b><span>${q ? `${q} รายการยังไม่ขึ้น Sheet (ส่งอัตโนมัติเมื่อออนไลน์)` : 'ส่งครบทุกรายการแล้ว ✓'}</span></div>${q ? `<button class="btn btn-ghost btn-sm" data-act="s-flush">ส่งตอนนี้</button>` : ''}</div>
    </div>
    <div class="card">
      <div class="card-title"><span class="t">${ic('phone')} เครื่องนี้</span></div>
      <div class="row"><div class="l"><b>ห้องที่ใช้ประเมิน</b><span>${settings.room ? `${esc(settings.unit)} › ${esc(currentRoom())}` : 'ยังไม่ได้เลือก'}</span></div><button class="btn btn-ghost btn-sm" data-act="pick-room">เปลี่ยน</button></div>
      <div class="row"><div class="l" style="flex:1"><b>ชื่ออุปกรณ์ / ผู้ใช้</b><span>บันทึกไว้ในคอลัมน์ “อุปกรณ์” ใน Sheet</span><input class="inp" id="sDevice" style="margin-top:8px" value="${esc(settings.device)}"></div></div>
      <div class="row"><div class="l"><b>เสียงเอฟเฟกต์</b><span>เสียงน่ารักเวลาแตะ/ส่งคะแนน</span></div><button class="switch ${settings.sound ? 'on' : ''}" data-act="s-toggle" data-k="sound" aria-label="เสียง"></button></div>
      <div class="row"><div class="l"><b>สั่นตอบสนอง</b><span>สั่นเบาๆ เมื่อแตะ (Android)</span></div><button class="switch ${settings.haptic ? 'on' : ''}" data-act="s-toggle" data-k="haptic" aria-label="สั่น"></button></div>
    </div>
    ${mode === 'local' ? `<div class="card">
      <div class="card-title"><span class="t">${ic('sparkle')} ข้อมูลตัวอย่าง</span></div>
      <p class="help" style="margin-top:0">ใช้ทดลองดูแดชบอร์ดก่อนเชื่อม Google Sheet — ข้อมูลตัวอย่างจะไม่ถูกส่งขึ้น Sheet</p>
      <div class="btn-row">${hasDemo() ? `<button class="btn btn-danger btn-sm" data-act="s-cleardemo">${ic('trash')} ล้างข้อมูลตัวอย่าง</button>` : `<button class="btn btn-soft btn-sm" data-act="s-seed">${ic('sparkle')} สร้างข้อมูลตัวอย่าง</button>`}</div>
    </div>` : ''}
    <div class="card" style="text-align:center">
      <div style="width:64px;margin:0 auto">${faceSVG(5)}</div>
      <div class="wordmark" style="font-size:20px;margin-top:6px">Happinometer</div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">แบบประเมินความพึงพอใจผู้ป่วย · v1.0<br>${UNITS.length} หน่วย · ${UNITS.reduce((a, u) => a + u.rooms.length, 0)} ห้องตรวจ</div>
      <div class="credit" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">conceived, designed, and Brought to Life by <b>RN.Patipon Wiyo</b></div>
    </div>
  </section>`;
  const dv = $('#sDevice'); if (dv) dv.addEventListener('change', (e) => { settings.device = e.target.value.trim() || settings.device; saveSettings(); toast('บันทึกชื่ออุปกรณ์แล้ว', 'ok'); });
}
async function testConnection() {
  try {
    const r = await Backend.info();
    if (r && r.ok) {
      if (r.sheetUrl) { settings.sheetUrl = r.sheetUrl; saveSettings(); }
      toast(r.local ? 'โหมดออฟไลน์ทำงานปกติ' : `${ic('check')} เชื่อมต่อสำเร็จ · ${esc(r.sheetName || 'Google Sheet')}`, 'ok', 3200);
      setSync(); if (screen === 'settings') renderSettings();
    } else throw new Error((r && r.error) || 'ไม่ตอบสนอง');
  } catch (e) { toast('เชื่อมต่อไม่สำเร็จ: ' + esc(e.message || e), 'err', 4200); }
}

/* =====================================================================
 *  events
 * ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'nav': go(el.dataset.to); break;
    case 'pick-room': openPicker(); break;
    case 'close-picker': closePicker(); break;
    case 'pk-recent': { const r = load(LS.recent, [])[+el.dataset.i]; if (r) { Object.assign(pick, r); renderPicker(); } break; }
    case 'pk-unit': { pick.unit = el.dataset.v; const u = UNITS.find((x) => x.unit === pick.unit); pick.room = u && u.rooms.length === 1 ? u.rooms[0] : ''; renderPicker(); break; }
    case 'pk-room': pick.room = el.dataset.v; renderPicker(); break;
    case 'pk-save': savePicker(); break;
    case 'start': startSurvey(); break;
    case 'ans': answer(el); break;
    case 'score': pickScore(+el.dataset.v); break;
    case 'back': if (survey.step > 0) { survey.prevStep = survey.step + 1; survey.step--; renderSurvey(-1); } else { survey = null; go('home'); } break;
    case 'quit': survey = null; go('home'); break;
    case 'thanks-done': go('home'); break;
    case 'refresh': loadDash(false); break;
    case 'd-period': {
      dash.period = el.dataset.v;
      if (dash.period === 'custom' && !dash.from) { dash.from = addDays(todayStr(), -6); dash.to = todayStr(); }
      dashKnownIds = null; renderDash(); break;
    }
    case 'd-mine': dash.unit = settings.unit; dash.room = currentRoom(); renderDash(); break;
    case 'd-room': dash.unit = el.dataset.u; dash.room = el.dataset.r; renderDash(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'd-allrooms': dash.showAllRooms = !dash.showAllRooms; drawDash(null); break;
    case 'csv': exportCSV(); break;
    case 's-saveapi': { const v = ($('#sApi').value || '').trim(); settings.apiUrl = v; settings.manualOffline = !v; saveSettings(); dashRecords = []; lastUpdated = null; dashKnownIds = null; homeStats = null; toast(v ? 'บันทึก URL แล้ว กำลังทดสอบ…' : 'ล้าง URL แล้ว (โหมดออฟไลน์)', 'ok'); renderSettings(); renderChrome(); if (v) testConnection().then(() => { flushQueue(); refreshHome(); }); break; }
    case 's-test': testConnection(); break;
    case 's-flush': flushQueue().then(() => renderSettings()); break;
    case 's-toggle': settings[el.dataset.k] = !settings[el.dataset.k]; saveSettings(); el.classList.toggle('on', settings[el.dataset.k]); if (el.dataset.k === 'sound' && settings.sound) tone([660, 880], 0.1); if (el.dataset.k === 'haptic') buzz(30); break;
    case 's-cleardemo': save(LS.local, load(LS.local, []).filter((x) => !x.isDemo)); settings.noDemo = true; saveSettings(); dashRecords = []; lastUpdated = null; homeStats = null; toast('ล้างข้อมูลตัวอย่างแล้ว', 'ok'); renderSettings(); refreshHome(); break;
    case 's-seed': seedDemo(); settings.noDemo = false; saveSettings(); homeStats = null; toast('สร้างข้อมูลตัวอย่างแล้ว ✨', 'ok'); renderSettings(); refreshHome(); break;
  }
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'dUnit') { dash.unit = e.target.value; dash.room = 'ALL'; renderDash(); }
  if (id === 'dRoom') { dash.room = e.target.value; drawDash(null); renderDashFiltersOnly(); }
  if (id === 'dFrom' || id === 'dTo') { dash.from = $('#dFrom').value; dash.to = $('#dTo').value; if (dash.from > dash.to) [dash.from, dash.to] = [dash.to, dash.from]; dashKnownIds = null; renderDash(); }
});
function renderDashFiltersOnly() { const mine = $('[data-act="d-mine"]'); if (mine) mine.classList.toggle('on', dash.unit === settings.unit && dash.room === currentRoom()); }
$('#sheetWrap').addEventListener('click', (e) => { if (e.target.id === 'sheetWrap') closePicker(); });
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { if (screen === 'survey') bumpIdle(); }, { passive: true }));

setInterval(() => { if (document.hidden) return; if (screen === 'dash') loadDash(true); }, POLL_DASH_MS);
setInterval(() => { if (document.hidden) return; if (screen === 'home') refreshHome(); }, POLL_HOME_MS);
setInterval(() => { if (load(LS.queue, []).length) flushQueue(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (screen === 'dash') loadDash(true); if (screen === 'home') refreshHome(); flushQueue(); } });

/* =====================================================================
 *  boot
 * ===================================================================== */
(function boot() {
  if (Backend.mode === 'local' && !settings.noDemo && !load(LS.local, []).length) seedDemo();
  renderChrome();
  go('home');
  if (!settings.room) setTimeout(openPicker, 450);
  refreshHome();
  flushQueue();
  if (Backend.mode !== 'local') Backend.info().then((r) => { if (r && r.sheetUrl) { settings.sheetUrl = r.sheetUrl; saveSettings(); } setSync(); }).catch(() => setSync('error'));
})();
})();
</script>
</body>
</html>
